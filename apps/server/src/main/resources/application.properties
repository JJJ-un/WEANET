spring.application.name=server

# Weather API (KMA - 기상청 단기예보)
weather.api.key=${WEATHER_API_KEY:YOUR_KMA_API_KEY}
weather.api.url=http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst

# Tmap API (Route & Subway Congestion)
tmap.api.key=${TMAP_API_KEY:YOUR_TMAP_API_KEY}
tmap.api.url=https://apis.openapi.sk.com/transit/routes
tmap.api.poi.url=https://apis.openapi.sk.com/tmap/pois
subway.congestion.api.url=https://apis.openapi.sk.com/puzzle/subway/congestion/rltm/stat/stations

# Public Data API (Bus Congestion)
public.data.api.key=${PUBLIC_DATA_API_KEY:YOUR_PUBLIC_DATA_API_KEY}
bus.congestion.api.url=http://ws.bus.go.kr/api/rest/arrive/getLowArrInfoByStId

# Seoul Data API (Subway Realtime)
seoul.api.key=${SEOUL_DATA_API_KEY:YOUR_SEOUL_API_KEY}

# Database (MySQL - Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/ddubuk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=ddubuk_user
spring.datasource.password=ddubuk_password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

