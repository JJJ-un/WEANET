spring.application.name=server

# Weather API
# 환경 변수 WEATHER_API_KEY가 있으면 사용하고, 없으면 기본값 사용
weather.api.key=${WEATHER_API_KEY:YOUR_OPENWEATHERMAP_API_KEY}
weather.api.url=https://api.openweathermap.org/data/2.5/forecast

# Database (H2)
spring.datasource.url=jdbc:h2:mem:ddubukdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true